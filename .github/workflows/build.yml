name: Test and build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m py_compile mouse_spin.py
      - name: Run tests
        run: python -m unittest -v

  # A standalone mouse_spin.exe so nobody has to install Python to use it.
  exe:
    name: Build mouse_spin.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: >
          pyinstaller --onefile --name mouse_spin --clean --noconfirm
          mouse_spin.py
      - name: Smoke test
        run: dist\mouse_spin.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: mouse_spin-windows-x64
          path: dist/mouse_spin.exe
          if-no-files-found: error

  # Pushing a tag like v1.1.0 publishes a Release with the exe attached, so
  # there is a permanent download link (CI artifacts expire).
  release:
    name: Publish release
    needs: exe
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mouse_spin-windows-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: mouse_spin.exe
          generate_release_notes: true
